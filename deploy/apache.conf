<VirtualHost *:80>
    ServerName aws-authenticator.local

    WSGIDaemonProcess aws-authenticator user=www-data group=www-data processes=2 threads=5 python-home=/var/www/aws-authenticator/.venv python-path=/var/www/aws-authenticator
    WSGIProcessGroup aws-authenticator
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /var/www/aws-authenticator/wsgi.py

    <Directory /var/www/aws-authenticator>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/aws-authenticator-error.log
    CustomLog ${APACHE_LOG_DIR}/aws-authenticator-access.log combined
</VirtualHost>
